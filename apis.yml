aid: dream
name: Dream
description: 'Dream (Dream Security / Dream Group) is an AI company for national cybersecurity and
  sovereign AI, founded in 2023 by Shalev Hulio, former Austrian Chancellor Sebastian Kurz, and Gil
  Dolev, with offices in Tel Aviv, Vienna, and Abu Dhabi. Dream builds a full sovereign AI stack that
  nations own, control, and operate with zero foreign reliance, delivered on-premises and air-gapped
  with no foreign telemetry. Its platform spans three products: Atlas, a national AI platform that
  turns government data into knowledge and decisions across intelligence, finance, health, and supply
  chain; Sphere, a unified cyber-defense system protecting government and critical infrastructure
  against nation-state threats; and Hero, an autonomous multi-agent solution for vulnerability
  discovery and patching. Backed by Bain Capital Ventures and others at a multibillion-dollar
  valuation, Dream has no public developer API surface; this profile captures its identity and
  domain-security posture.'
